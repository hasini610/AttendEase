<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Sessions - AttendEase</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="aesthetic-app-body" data-active-page="sessions">

<div class="aesthetic-layout-container">
    <aside class="sidebar-rail" id="sidebarRail"></aside>
    <div class="aesthetic-main-canvas">
        <header class="aesthetic-topbar" id="topbarHeader" data-page-title="Manage Class Sessions"></header>
        <div class="aesthetic-content-area">
            <div id="flashContainer"></div>

            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                <div>
                    <h1 class="hero-main-title">Class Sessions</h1>
                    <p class="hero-sub-title">Manage your conducted lecture sessions and attendance records.</p>
                </div>
                <button class="btn btn-navy-pill" data-bs-toggle="modal" data-bs-target="#createSessionModal">
                    <i class="bi bi-plus-circle me-2"></i>New Session
                </button>
            </div>

            <!-- Filters -->
            <div class="aesthetic-white-card mb-4">
                <form id="filterForm" class="row g-3 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label fw-semibold fs-13">Filter by Subject / Class</label>
                        <select class="form-select form-select-sm" id="filterAssignment" name="assignment_id">
                            <option value="">All Assignments</option>
                        </select>
                    </div>
                    <div class="col-md-auto">
                        <button type="submit" class="btn btn-primary btn-sm rounded-pill px-3">Apply Filter</button>
                        <a href="/faculty/sessions" class="btn btn-outline-secondary btn-sm rounded-pill px-3 ms-1">Clear</a>
                    </div>
                </form>
            </div>

            <!-- Sessions Table -->
            <div class="aesthetic-white-card">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h2 class="card-section-title mb-0">Session Records <span class="badge bg-light text-dark border fs-12 ms-1" id="sessionCountBadge">...</span></h2>
                </div>
                <div class="table-responsive">
                    <table class="table aesthetic-table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Session #</th>
                                <th>Subject / Class</th>
                                <th>Topic</th>
                                <th class="text-center">Marked</th>
                                <th class="text-center">Present</th>
                                <th class="text-center">Absent</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="sessionsTbody">
                            <tr><td colspan="8" class="text-center py-5 text-muted"><span class="spinner-border spinner-border-sm me-1"></span>Loading sessions...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Create Session Modal -->
<div class="modal fade" id="createSessionModal" tabindex="-1" aria-labelledby="createSessionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="createSessionModalLabel"><i class="bi bi-plus-circle me-2 text-primary"></i>Create New Session</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form method="POST" action="/faculty/sessions/create">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Subject &amp; Class <span class="text-danger">*</span></label>
                        <select class="form-select" name="assignment_id" id="modalAssignment" required>
                            <option value="">Select subject and class...</option>
                        </select>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Session Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" name="session_date" id="modalDate" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Session Number</label>
                            <input type="number" class="form-control" name="session_number" min="1" value="1">
                        </div>
                    </div>
                    <div class="mt-3">
                        <label class="form-label fw-semibold">Topic / Lecture Title</label>
                        <input type="text" class="form-control" name="topic" placeholder="e.g. Introduction to Linked Lists">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-plus-circle me-1"></i>Create &amp; Mark Attendance
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
let allAssignments = [];

document.addEventListener('DOMContentLoaded', async () => {
    // Set today's date as default
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('modalDate').value = today;

    const urlParams = new URLSearchParams(window.location.search);
    const initAssignment = urlParams.get('assignment_id') || '';
    await loadSessions(initAssignment);

    document.getElementById('filterForm').addEventListener('submit', e => {
        e.preventDefault();
        const assignmentId = document.getElementById('filterAssignment').value;
        loadSessions(assignmentId);
    });
});

async function loadSessions(assignmentId) {
    try {
        const qs = assignmentId ? `?assignment_id=${encodeURIComponent(assignmentId)}` : '';
        const data = await AttendEase.apiFetch(`/api/faculty/sessions${qs}`);
        renderSessions(data);
    } catch (err) {
        AttendEase.showFlash('Failed to load sessions.', 'error');
    }
}

function renderSessions(data) {
    const sessions = data.sessions || [];
    const assignments = data.assignments || [];
    allAssignments = assignments;

    // Populate assignment dropdowns
    const filterSel = document.getElementById('filterAssignment');
    const modalSel = document.getElementById('modalAssignment');
    filterSel.innerHTML = '<option value="">All Assignments</option>' +
        assignments.map(a => `<option value="${a.id}">${AttendEase.escapeHtml(a.class_name)} - ${AttendEase.escapeHtml(a.subject_code)}: ${AttendEase.escapeHtml(a.subject_name)}</option>`).join('');
    modalSel.innerHTML = '<option value="">Select subject and class...</option>' +
        assignments.map(a => `<option value="${a.id}">${AttendEase.escapeHtml(a.class_name)} - ${AttendEase.escapeHtml(a.subject_code)}: ${AttendEase.escapeHtml(a.subject_name)}</option>`).join('');

    document.getElementById('sessionCountBadge').textContent = `${sessions.length} records`;

    const tbody = document.getElementById('sessionsTbody');
    if (sessions.length > 0) {
        tbody.innerHTML = sessions.map(s => {
            const total = Number(s.total_marked) || 0;
            const present = (Number(s.present_count)||0) + (Number(s.late_count)||0);
            const absent = Number(s.absent_count)||0;
            const pct = total > 0 ? Math.round(present/total*100) : 0;
            return `
                <tr>
                    <td class="text-nowrap"><i class="bi bi-calendar3 me-1 text-muted"></i>${AttendEase.formatDate(s.session_date)}</td>
                    <td><span class="badge bg-light text-dark border">#${s.session_number||1}</span></td>
                    <td>
                        <div class="fw-bold text-dark">${AttendEase.escapeHtml(s.class_name)}</div>
                        <small class="text-muted"><span class="badge bg-primary-subtle text-primary border border-primary-subtle me-1">${AttendEase.escapeHtml(s.subject_code)}</span>${AttendEase.escapeHtml(s.subject_name)}</small>
                    </td>
                    <td class="text-muted fs-13">${AttendEase.escapeHtml(s.topic||'Regular Lecture')}</td>
                    <td class="text-center">${total}</td>
                    <td class="text-center"><span class="badge bg-success-subtle text-success border border-success-subtle">${present}</span></td>
                    <td class="text-center"><span class="badge bg-danger-subtle text-danger border border-danger-subtle">${absent}</span></td>
                    <td>
                        <a href="/faculty/history/${s.id}" class="btn btn-sm btn-outline-primary rounded-pill px-2 fs-12 me-1">
                            <i class="bi bi-eye me-1"></i>View
                        </a>
                        <a href="/faculty/mark/${s.id}" class="btn btn-sm btn-outline-success rounded-pill px-2 fs-12">
                            <i class="bi bi-pencil-square me-1"></i>Mark
                        </a>
                    </td>
                </tr>
            `;
        }).join('');
    } else {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-5 text-muted"><i class="bi bi-folder-x fs-2 d-block mb-2"></i>No sessions found matching the filter.</td></tr>`;
    }
}
</script>
</body>
</html>
