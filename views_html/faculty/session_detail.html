<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Details - AttendEase</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="aesthetic-app-body" data-active-page="history">

<div class="aesthetic-layout-container">
    <aside class="sidebar-rail" id="sidebarRail"></aside>
    <div class="aesthetic-main-canvas">
        <header class="aesthetic-topbar" id="topbarHeader" data-page-title="Lecture Attendance Details"></header>
        <div class="aesthetic-content-area">
            <div id="flashContainer"></div>

            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                <div>
                    <h1 class="hero-main-title">Lecture Attendance Details</h1>
                    <p class="hero-sub-title" id="pageSubtitle">Loading session...</p>
                </div>
                <div class="d-flex gap-2">
                    <a href="/faculty/history" class="btn btn-outline-secondary rounded-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i>Back to History
                    </a>
                    <a href="#" class="btn btn-outline-success rounded-pill px-3" id="editMarkBtn">
                        <i class="bi bi-pencil-square me-1"></i>Edit Marks
                    </a>
                </div>
            </div>

            <!-- Session Info Card -->
            <div class="row g-4 mb-4" id="sessionInfoRow">
                <div class="col text-center py-4 text-muted">
                    <span class="spinner-border spinner-border-sm me-1"></span>Loading...
                </div>
            </div>

            <!-- Attendance Summary Bar -->
            <div class="aesthetic-white-card mb-4" id="summaryCard" style="display:none;">
                <h2 class="card-section-title mb-3">Attendance Summary</h2>
                <div class="d-flex flex-wrap gap-3 align-items-center mb-3">
                    <div class="p-3 rounded-3 border bg-success-subtle text-center" style="min-width: 100px;">
                        <div class="fw-bold fs-22 text-success" id="sumPresent">0</div>
                        <div class="fs-12 text-muted">Present</div>
                    </div>
                    <div class="p-3 rounded-3 border bg-warning-subtle text-center" style="min-width: 100px;">
                        <div class="fw-bold fs-22 text-warning" id="sumLate">0</div>
                        <div class="fs-12 text-muted">Late</div>
                    </div>
                    <div class="p-3 rounded-3 border bg-danger-subtle text-center" style="min-width: 100px;">
                        <div class="fw-bold fs-22 text-danger" id="sumAbsent">0</div>
                        <div class="fs-12 text-muted">Absent</div>
                    </div>
                    <div class="p-3 rounded-3 border bg-light text-center" style="min-width: 100px;">
                        <div class="fw-bold fs-22" id="sumTotal">0</div>
                        <div class="fs-12 text-muted">Total</div>
                    </div>
                    <div class="flex-grow-1">
                        <div class="fs-13 text-muted mb-1">Attendance Rate</div>
                        <div class="progress aesthetic-progress" style="height: 12px;">
                            <div class="progress-bar bg-lime-glow" id="summaryProgressBar" style="width: 0%"></div>
                        </div>
                        <div class="fs-13 fw-bold mt-1" id="summaryPct">0%</div>
                    </div>
                </div>
            </div>

            <!-- Student Roster -->
            <div class="aesthetic-white-card">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h2 class="card-section-title mb-0">Student Attendance Register</h2>
                    <div class="d-flex gap-2 fs-12">
                        <span class="badge bg-success-subtle text-success border border-success-subtle p-2">Present</span>
                        <span class="badge bg-warning-subtle text-dark border border-warning-subtle p-2">Late</span>
                        <span class="badge bg-danger-subtle text-danger border border-danger-subtle p-2">Absent</span>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table aesthetic-table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Roll No.</th>
                                <th>Student Name</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Recorded At</th>
                            </tr>
                        </thead>
                        <tbody id="rosterTbody">
                            <tr><td colspan="6" class="text-center py-5 text-muted"><span class="spinner-border spinner-border-sm me-1"></span>Loading student roster...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const pathParts = window.location.pathname.split('/');
    const sessionId = pathParts[pathParts.length - 1];
    if (!sessionId || isNaN(sessionId)) {
        AttendEase.showFlash('Invalid session ID.', 'error');
        return;
    }

    try {
        const data = await AttendEase.apiFetch(`/api/faculty/history/${sessionId}`);
        renderSessionDetails(data, sessionId);
    } catch (err) {
        AttendEase.showFlash('Failed to load session details.', 'error');
    }
});

function renderSessionDetails(data, sessionId) {
    const sessionData = data.sessionData || {};
    const students = data.studentRecords || [];

    document.getElementById('editMarkBtn').href = `/faculty/mark/${sessionId}`;
    document.getElementById('pageSubtitle').innerHTML =
        `<strong>${AttendEase.escapeHtml(sessionData.subject_code||'')} - ${AttendEase.escapeHtml(sessionData.subject_name||'')}</strong> &bull; ${AttendEase.escapeHtml(sessionData.class_name||'')} &bull; ${AttendEase.formatDate(sessionData.session_date)}`;

    const infoRow = document.getElementById('sessionInfoRow');
    infoRow.innerHTML = `
        <div class="col-md-3"><div class="aesthetic-white-card text-center">
            <div class="fs-12 text-muted mb-1">Subject</div>
            <div class="fw-bold">${AttendEase.escapeHtml(sessionData.subject_code||'')} - ${AttendEase.escapeHtml(sessionData.subject_name||'')}</div>
        </div></div>
        <div class="col-md-3"><div class="aesthetic-white-card text-center">
            <div class="fs-12 text-muted mb-1">Class</div>
            <div class="fw-bold">${AttendEase.escapeHtml(sessionData.class_name||'')}</div>
        </div></div>
        <div class="col-md-3"><div class="aesthetic-white-card text-center">
            <div class="fs-12 text-muted mb-1">Date / Session</div>
            <div class="fw-bold">${AttendEase.formatDate(sessionData.session_date)} &nbsp; #${sessionData.session_number||1}</div>
        </div></div>
        <div class="col-md-3"><div class="aesthetic-white-card text-center">
            <div class="fs-12 text-muted mb-1">Topic</div>
            <div class="fw-bold">${AttendEase.escapeHtml(sessionData.topic||'Regular Lecture')}</div>
        </div></div>
    `;

    // Summary
    const present = students.filter(s => s.status === 'present').length;
    const late = students.filter(s => s.status === 'late').length;
    const absent = students.filter(s => s.status === 'absent').length;
    const total = students.length;
    const attended = present + late;
    const pct = total > 0 ? Math.round(attended / total * 100) : 0;

    document.getElementById('sumPresent').textContent = present;
    document.getElementById('sumLate').textContent = late;
    document.getElementById('sumAbsent').textContent = absent;
    document.getElementById('sumTotal').textContent = total;
    document.getElementById('summaryProgressBar').style.width = `${pct}%`;
    document.getElementById('summaryPct').textContent = `${pct}% attendance rate`;
    document.getElementById('summaryCard').style.display = '';

    // Roster table
    const tbody = document.getElementById('rosterTbody');
    if (students.length > 0) {
        tbody.innerHTML = students.map((s, idx) => {
            let statusBadge = `<span class="badge bg-danger-subtle text-danger border border-danger-subtle">Absent</span>`;
            if (s.status === 'present') statusBadge = `<span class="badge bg-success-subtle text-success border border-success-subtle">Present</span>`;
            else if (s.status === 'late') statusBadge = `<span class="badge bg-warning-subtle text-dark border border-warning-subtle">Late</span>`;
            const markedAt = s.marked_at ? new Date(s.marked_at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '-';
            return `
                <tr>
                    <td class="text-muted">${idx+1}</td>
                    <td><span class="badge bg-light text-dark border">${AttendEase.escapeHtml(s.roll_number||'')}</span></td>
                    <td class="fw-bold text-dark">${AttendEase.escapeHtml(s.full_name||'')}</td>
                    <td class="text-muted fs-13">${AttendEase.escapeHtml(s.email||'')}</td>
                    <td>${statusBadge}</td>
                    <td class="text-muted fs-12">${markedAt}</td>
                </tr>
            `;
        }).join('');
    } else {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-muted">No student records found for this session.</td></tr>`;
    }
}
</script>
</body>
</html>
