<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - AttendEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">

<div class="login-wrapper text-center">
    <div class="login-card">
        <div class="brand-glyph-circle mb-3" style="width:68px; height:68px; font-size:32px;" id="errorIconBox">
            <i class="bi bi-exclamation-triangle-fill text-danger" id="errorIcon"></i>
        </div>

        <h1 class="brand-title mb-2" id="errorTitle">Notice</h1>
        <p class="brand-subtitle mb-4" id="errorMessage">Something went wrong.</p>

        <div class="d-flex justify-content-center gap-2">
            <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill px-4">
                <i class="bi bi-arrow-left me-1"></i> Go Back
            </a>
            <a href="/login" class="btn btn-navy-pill" id="errorHomeBtn">
                <i class="bi bi-box-arrow-in-right me-1"></i> Dashboard / Login
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const params = new URLSearchParams(window.location.search);
        const status = params.get('status') || '500';
        const title = params.get('title');
        const message = params.get('message');

        const titleEl = document.getElementById('errorTitle');
        const messageEl = document.getElementById('errorMessage');
        const iconEl = document.getElementById('errorIcon');
        const homeBtn = document.getElementById('errorHomeBtn');

        if (status === '403') {
            titleEl.textContent = title || 'Access Forbidden';
            messageEl.textContent = message || 'You do not have permission to view or modify this resource.';
            iconEl.className = 'bi bi-shield-x text-warning';
        } else if (status === '404') {
            titleEl.textContent = title || 'Page Not Found';
            messageEl.textContent = message || 'The requested page or resource could not be found.';
            iconEl.className = 'bi bi-search text-info';
        } else {
            titleEl.textContent = title || 'Server Error';
            messageEl.textContent = message || 'An unexpected error occurred. Please try again.';
            iconEl.className = 'bi bi-exclamation-triangle-fill text-danger';
        }

        const user = await AttendEase.getCurrentUser();
        if (user && user.role) {
            homeBtn.href = `/${user.role}/dashboard`;
            homeBtn.innerHTML = '<i class="bi bi-grid-fill me-1"></i> Return to Dashboard';
        } else {
            homeBtn.href = '/login';
            homeBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Return to Login';
        }
    });
</script>
</body>
</html>
