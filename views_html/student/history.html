<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance History - AttendEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="aesthetic-app-body" data-active-page="history">

<div class="aesthetic-layout-container">
    <aside class="sidebar-rail" id="sidebarRail"></aside>

    <div class="aesthetic-main-canvas">
        <header class="aesthetic-topbar" id="topbarHeader" data-page-title="My Attendance History"></header>

        <div class="aesthetic-content-area">
            <div id="flashContainer"></div>

            <!-- HERO HEADER -->
            <div class="dashboard-hero-header d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                <div class="hero-left-titles">
                    <h1 class="hero-main-title">My Attendance History</h1>
                    <p class="hero-sub-title">
                        Complete chronological log of your class attendance records
                    </p>
                </div>
                <div class="hero-action-box">
                    <a href="/student/attendance" class="btn btn-navy-pill">
                        <i class="bi bi-pie-chart-fill me-2"></i>Subject Standing
                    </a>
                </div>
            </div>

            <!-- FILTERS CARD -->
            <div class="aesthetic-white-card mb-4">
                <div class="d-flex align-items-center justify-content-between pb-3 mb-3 border-bottom-subtle">
                    <h2 class="card-section-title mb-0"><i class="bi bi-funnel me-2"></i>Filter Attendance Logs</h2>
                    <button type="button" id="clearFilterBtn" class="btn btn-sm btn-outline-danger rounded-pill px-3" style="display:none;">
                        <i class="bi bi-x-circle me-1"></i>Clear Filters
                    </button>
                </div>

                <form id="filterHistoryForm" class="row g-3">
                    <div class="col-12 col-md-3">
                        <label class="form-label fs-13 fw-semibold">Subject</label>
                        <select name="subject_id" id="filterSubject" class="form-select pill-input">
                            <option value="">All Enrolled Subjects</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-3">
                        <label class="form-label fs-13 fw-semibold">Status</label>
                        <select name="status" id="filterStatus" class="form-select pill-input">
                            <option value="">All Statuses</option>
                            <option value="present">Present</option>
                            <option value="late">Late</option>
                            <option value="absent">Absent</option>
                        </select>
                    </div>

                    <div class="col-6 col-md-2">
                        <label class="form-label fs-13 fw-semibold">From Date</label>
                        <input type="date" name="date_from" id="filterDateFrom" class="form-control pill-input">
                    </div>

                    <div class="col-6 col-md-2">
                        <label class="form-label fs-13 fw-semibold">To Date</label>
                        <input type="date" name="date_to" id="filterDateTo" class="form-control pill-input">
                    </div>

                    <div class="col-12 col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-navy-pill w-100 py-2">
                            <i class="bi bi-search me-1"></i> Filter
                        </button>
                    </div>
                </form>
            </div>

            <!-- SUMMARY PILLS -->
            <div class="d-flex flex-wrap align-items-center gap-3 mb-3">
                <span class="badge bg-light text-dark border p-2 fs-13">
                    Total Records: <strong id="sumTotal">0</strong>
                </span>
                <span class="badge bg-success-subtle text-success border border-success-subtle p-2 fs-13">
                    <i class="bi bi-check-circle me-1"></i>Present: <strong id="sumPresent">0</strong>
                </span>
                <span class="badge bg-warning-subtle text-dark border border-warning-subtle p-2 fs-13">
                    <i class="bi bi-clock-history me-1"></i>Late: <strong id="sumLate">0</strong>
                </span>
                <span class="badge bg-danger-subtle text-danger border border-danger-subtle p-2 fs-13">
                    <i class="bi bi-x-circle me-1"></i>Absent: <strong id="sumAbsent">0</strong>
                </span>
            </div>

            <!-- RECORDS TABLE CARD -->
            <div class="aesthetic-white-card">
                <div class="table-responsive">
                    <table class="table aesthetic-table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Session Date</th>
                                <th>Subject</th>
                                <th>Faculty</th>
                                <th>Session / Topic</th>
                                <th>Status</th>
                                <th>Recorded At</th>
                            </tr>
                        </thead>
                        <tbody id="historyTbody">
                            <tr><td colspan="7" class="text-center py-5 text-muted"><span class="spinner-border spinner-border-sm me-1"></span>Loading attendance history...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const initialSubject = urlParams.get('subject_id') || '';
    const initialStatus = urlParams.get('status') || '';
    const initialFrom = urlParams.get('date_from') || '';
    const initialTo = urlParams.get('date_to') || '';

    if (initialSubject) document.getElementById('filterSubject').value = initialSubject;
    if (initialStatus) document.getElementById('filterStatus').value = initialStatus;
    if (initialFrom) document.getElementById('filterDateFrom').value = initialFrom;
    if (initialTo) document.getElementById('filterDateTo').value = initialTo;

    let subjectsLoaded = false;

    async function loadHistory() {
        const subject_id = document.getElementById('filterSubject').value;
        const status = document.getElementById('filterStatus').value;
        const date_from = document.getElementById('filterDateFrom').value;
        const date_to = document.getElementById('filterDateTo').value;

        const hasFilter = subject_id || status || date_from || date_to;
        document.getElementById('clearFilterBtn').style.display = hasFilter ? 'inline-block' : 'none';

        const queryParams = new URLSearchParams();
        if (subject_id) queryParams.set('subject_id', subject_id);
        if (status) queryParams.set('status', status);
        if (date_from) queryParams.set('date_from', date_from);
        if (date_to) queryParams.set('date_to', date_to);

        const qs = queryParams.toString() ? `?${queryParams.toString()}` : '';

        try {
            const data = await AttendEase.apiFetch(`/api/student/history${qs}`);

            // Populate subjects dropdown once
            if (!subjectsLoaded && data.enrolledSubjects) {
                const subSelect = document.getElementById('filterSubject');
                data.enrolledSubjects.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = `${s.code} - ${s.name}`;
                    if (s.id == initialSubject) opt.selected = true;
                    subSelect.appendChild(opt);
                });
                subjectsLoaded = true;
            }

            renderHistoryTable(data.records || []);
        } catch (err) {
            console.error('Failed to load history:', err);
            AttendEase.showFlash('Failed to load attendance logs.', 'error');
        }
    }

    function renderHistoryTable(records) {
        const countPresent = records.filter(r => r.status === 'present').length;
        const countLate = records.filter(r => r.status === 'late').length;
        const countAbsent = records.filter(r => r.status === 'absent').length;

        document.getElementById('sumTotal').textContent = records.length;
        document.getElementById('sumPresent').textContent = countPresent;
        document.getElementById('sumLate').textContent = countLate;
        document.getElementById('sumAbsent').textContent = countAbsent;

        const tbody = document.getElementById('historyTbody');
        if (records.length > 0) {
            tbody.innerHTML = records.map((r, idx) => {
                let statusBadge = '<span class="badge-status-danger"><i class="bi bi-x-circle me-1"></i>Absent</span>';
                if (r.status === 'present') {
                    statusBadge = '<span class="badge-status-lime"><i class="bi bi-check-circle me-1"></i>Present</span>';
                } else if (r.status === 'late') {
                    statusBadge = '<span class="badge bg-warning text-dark"><i class="bi bi-clock-history me-1"></i>Late</span>';
                }

                return `
                    <tr>
                        <td class="text-muted fs-12">${idx + 1}</td>
                        <td class="text-nowrap fw-bold text-dark">
                            <i class="bi bi-calendar3 me-1 text-primary"></i>
                            ${AttendEase.formatDate(r.session_date)}
                        </td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge bg-light text-dark border">${AttendEase.escapeHtml(r.subject_code)}</span>
                                <span class="fw-bold text-dark">${AttendEase.escapeHtml(r.subject_name)}</span>
                            </div>
                        </td>
                        <td class="text-secondary fs-13">
                            <i class="bi bi-person me-1"></i>${AttendEase.escapeHtml(r.faculty_name || '')}
                        </td>
                        <td class="fs-13">
                            <span class="badge bg-secondary-subtle text-secondary me-1">Lec #${r.session_number || 1}</span>
                            <span class="text-muted">${AttendEase.escapeHtml(r.topic || 'Regular Classroom Session')}</span>
                        </td>
                        <td>${statusBadge}</td>
                        <td class="text-muted fs-12 text-nowrap">
                            ${r.marked_at ? new Date(r.marked_at).toLocaleString() : 'N/A'}
                        </td>
                    </tr>
                `;
            }).join('');
        } else {
            tbody.innerHTML = `
                <tr>
                    <td colspan="7" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox fs-1 d-block mb-2 text-secondary opacity-50"></i>
                        No attendance records match your filter criteria.
                    </td>
                </tr>
            `;
        }
    }

    document.getElementById('filterHistoryForm').addEventListener('submit', (e) => {
        e.preventDefault();
        loadHistory();
    });

    document.getElementById('clearFilterBtn').addEventListener('click', () => {
        document.getElementById('filterSubject').value = '';
        document.getElementById('filterStatus').value = '';
        document.getElementById('filterDateFrom').value = '';
        document.getElementById('filterDateTo').value = '';
        loadHistory();
    });

    await loadHistory();
});
</script>
</body>
</html>
