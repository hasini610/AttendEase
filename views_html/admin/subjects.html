<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum &amp; Subjects - AttendEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="aesthetic-app-body" data-active-page="subjects">

<div class="aesthetic-layout-container">
    <aside class="sidebar-rail" id="sidebarRail"></aside>

    <div class="aesthetic-main-canvas">
        <header class="aesthetic-topbar" id="topbarHeader" data-page-title="Course Curriculum &amp; Subjects"></header>

        <div class="aesthetic-content-area">
            <div id="flashContainer"></div>

            <!-- HERO HEADER -->
            <div class="dashboard-hero-header d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                <div class="hero-left-titles">
                    <h1 class="hero-main-title">Course Curriculum &amp; Subjects</h1>
                    <p class="hero-sub-title">Configure subject codes, syllabus titles, department mappings, and credit points</p>
                </div>
                <div class="hero-action-box">
                    <button type="button" class="btn btn-navy-pill" data-bs-toggle="modal" data-bs-target="#addSubjectModal">
                        <i class="bi bi-book-fill me-2"></i>+ Add Subject
                    </button>
                </div>
            </div>

            <!-- SUBJECTS TABLE CARD -->
            <div class="aesthetic-white-card">
                <div class="d-flex align-items-center justify-content-between mb-3 pb-2 border-bottom-subtle">
                    <h2 class="card-section-title mb-0" id="subjectHeaderCount">Active Subjects (0)</h2>
                    <span class="badge-status-lime">Curriculum</span>
                </div>

                <div class="table-responsive">
                    <table class="table aesthetic-table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Subject Title</th>
                                <th>Course Code</th>
                                <th>Department</th>
                                <th>Credits</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="subjectsTbody">
                            <tr>
                                <td colspan="5" class="text-center py-5 text-muted">
                                    <div class="spinner-border text-primary spinner-border-sm me-2" role="status"></div>
                                    Loading subjects...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- ADD SUBJECT MODAL -->
<div class="modal fade" id="addSubjectModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content aesthetic-white-card p-4 border-0">
            <div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom-subtle">
                <h3 class="card-section-title mb-0">+ Add Subject</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form action="/admin/subjects/create" method="POST">
                <div class="mb-3">
                    <label class="form-label fs-13 fw-semibold">Subject Title *</label>
                    <input type="text" name="name" class="form-control pill-input" placeholder="e.g. Artificial Intelligence" required>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label fs-13 fw-semibold">Course Code *</label>
                        <input type="text" name="code" class="form-control pill-input" placeholder="e.g. CS401" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label fs-13 fw-semibold">Credits</label>
                        <input type="number" name="credits" class="form-control pill-input" value="3" min="1" max="10">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fs-13 fw-semibold">Department *</label>
                    <select name="department_id" id="addSubjectDeptSelect" class="form-select pill-input" required>
                        <option value="">Select Dept</option>
                    </select>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-navy-pill">Create Subject</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- REUSABLE EDIT SUBJECT MODAL -->
<div class="modal fade" id="editSubjectModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content aesthetic-white-card p-4 border-0">
            <div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom-subtle">
                <h3 class="card-section-title mb-0">Edit Subject</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="editSubjectForm" method="POST">
                <div class="mb-3">
                    <label class="form-label fs-13 fw-semibold">Subject Title *</label>
                    <input type="text" id="editSubjectName" name="name" class="form-control pill-input" required>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label fs-13 fw-semibold">Course Code *</label>
                        <input type="text" id="editSubjectCode" name="code" class="form-control pill-input" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label fs-13 fw-semibold">Credits</label>
                        <input type="number" id="editSubjectCredits" name="credits" class="form-control pill-input" min="1" max="10">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fs-13 fw-semibold">Department *</label>
                    <select id="editSubjectDept" name="department_id" class="form-select pill-input" required></select>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-navy-pill">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>

<script>
let allSubjects = [];
let allDepartments = [];

document.addEventListener('DOMContentLoaded', () => {
    loadSubjects();
});

async function loadSubjects() {
    try {
        const data = await AttendEase.apiFetch('/api/admin/subjects');
        allSubjects = data.subjects || [];
        allDepartments = data.departments || [];

        populateDepartments();
        renderSubjectsTable(allSubjects);
    } catch (err) {
        console.error('Failed to load subjects:', err);
        AttendEase.showFlash('Failed to load subjects list.', 'error');
    }
}

function populateDepartments() {
    const deptSelect = document.getElementById('addSubjectDeptSelect');
    deptSelect.innerHTML = '<option value="">Select Dept</option>' +
        allDepartments.map(d => `<option value="${d.id}">${AttendEase.escapeHtml(d.code)} - ${AttendEase.escapeHtml(d.name)}</option>`).join('');
}

function renderSubjectsTable(subjects) {
    const tbody = document.getElementById('subjectsTbody');
    document.getElementById('subjectHeaderCount').textContent = `Active Subjects (${subjects.length})`;

    if (!subjects || subjects.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-muted">No subjects registered yet.</td></tr>`;
        return;
    }

    tbody.innerHTML = subjects.map(sub => `
        <tr>
            <td>
                <div class="fw-bold text-dark fs-14">${AttendEase.escapeHtml(sub.name)}</div>
            </td>
            <td><span class="badge-pill-soft">${AttendEase.escapeHtml(sub.code)}</span></td>
            <td><span class="fw-semibold text-dark">${AttendEase.escapeHtml(sub.dept_code || '')}</span> - ${AttendEase.escapeHtml(sub.department_name || '')}</td>
            <td><span class="badge bg-secondary-subtle text-secondary rounded-pill px-3">${sub.credits || 0} Credits</span></td>
            <td class="text-end">
                <button
                    type="button"
                    class="btn btn-sm btn-outline-secondary rounded-pill me-1"
                    onclick="openEditModal(${sub.id})"
                    title="Edit Subject"
                >
                    <i class="bi bi-pencil-fill"></i>
                </button>
                <form action="/admin/subjects/${sub.id}/delete" method="POST" style="display:inline;" onsubmit="return confirm('Delete subject ${AttendEase.escapeHtml(sub.name)}?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill" title="Delete">
                        <i class="bi bi-trash-fill"></i>
                    </button>
                </form>
            </td>
        </tr>
    `).join('');
}

function openEditModal(subId) {
    const sub = allSubjects.find(item => item.id === subId);
    if (!sub) return;

    document.getElementById('editSubjectForm').action = `/admin/subjects/${subId}/edit`;
    document.getElementById('editSubjectName').value = sub.name || '';
    document.getElementById('editSubjectCode').value = sub.code || '';
    document.getElementById('editSubjectCredits').value = sub.credits || 3;

    const editDept = document.getElementById('editSubjectDept');
    editDept.innerHTML = allDepartments.map(d => `
        <option value="${d.id}" ${sub.department_id === d.id ? 'selected' : ''}>
            ${AttendEase.escapeHtml(d.code)} - ${AttendEase.escapeHtml(d.name)}
        </option>
    `).join('');

    const modal = new bootstrap.Modal(document.getElementById('editSubjectModal'));
    modal.show();
}
</script>
</body>
</html>
