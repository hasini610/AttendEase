<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes &amp; Sections - AttendEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="aesthetic-app-body" data-active-page="classes">

<div class="aesthetic-layout-container">
    <aside class="sidebar-rail" id="sidebarRail"></aside>

    <div class="aesthetic-main-canvas">
        <header class="aesthetic-topbar" id="topbarHeader" data-page-title="Classes &amp; Sections"></header>

        <div class="aesthetic-content-area">
            <div id="flashContainer"></div>

            <!-- HERO HEADER -->
            <div class="dashboard-hero-header d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                <div class="hero-left-titles">
                    <h1 class="hero-main-title">Classes &amp; Sections</h1>
                    <p class="hero-sub-title">Configure student batches, departmental sections, and semester alignments</p>
                </div>
                <div class="hero-action-box">
                    <button type="button" class="btn btn-navy-pill" data-bs-toggle="modal" data-bs-target="#addClassModal">
                        <i class="bi bi-door-closed-fill me-2"></i>+ Add Class / Section
                    </button>
                </div>
            </div>

            <!-- CLASSES TABLE CARD -->
            <div class="aesthetic-white-card">
                <div class="d-flex align-items-center justify-content-between mb-3 pb-2 border-bottom-subtle">
                    <h2 class="card-section-title mb-0" id="classHeaderCount">Active Classes (0)</h2>
                    <span class="badge-status-lime">Academic Sections</span>
                </div>

                <div class="table-responsive">
                    <table class="table aesthetic-table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Class / Section</th>
                                <th>Department</th>
                                <th>Semester</th>
                                <th>Academic Year</th>
                                <th>Enrolled Students</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="classesTbody">
                            <tr>
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <div class="spinner-border text-primary spinner-border-sm me-2" role="status"></div>
                                    Loading classes...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- ADD CLASS MODAL -->
<div class="modal fade" id="addClassModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content aesthetic-white-card p-4 border-0">
            <div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom-subtle">
                <h3 class="card-section-title mb-0">+ Create New Class</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form action="/admin/classes/create" method="POST">
                <div class="mb-3">
                    <label class="form-label fs-13 fw-semibold">Class / Section Name *</label>
                    <input type="text" name="name" class="form-control pill-input" placeholder="e.g. CSE-C or ECE-B" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fs-13 fw-semibold">Department *</label>
                    <select name="department_id" id="addClassDeptSelect" class="form-select pill-input" required>
                        <option value="">Select Dept</option>
                    </select>
                </div>
                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <label class="form-label fs-13 fw-semibold">Semester *</label>
                        <select name="semester_id" id="addClassSemesterSelect" class="form-select pill-input" required></select>
                    </div>
                    <div class="col-6">
                        <label class="form-label fs-13 fw-semibold">Academic Year *</label>
                        <select name="academic_year_id" id="addClassYearSelect" class="form-select pill-input" required></select>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-navy-pill">Create Class</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- REUSABLE EDIT CLASS MODAL -->
<div class="modal fade" id="editClassModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content aesthetic-white-card p-4 border-0">
            <div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom-subtle">
                <h3 class="card-section-title mb-0">Edit Class / Section</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="editClassForm" method="POST">
                <div class="mb-3">
                    <label class="form-label fs-13 fw-semibold">Class / Section Name *</label>
                    <input type="text" id="editClassName" name="name" class="form-control pill-input" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fs-13 fw-semibold">Department *</label>
                    <select id="editClassDept" name="department_id" class="form-select pill-input" required></select>
                </div>
                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <label class="form-label fs-13 fw-semibold">Semester *</label>
                        <select id="editClassSemester" name="semester_id" class="form-select pill-input" required></select>
                    </div>
                    <div class="col-6">
                        <label class="form-label fs-13 fw-semibold">Academic Year *</label>
                        <select id="editClassYear" name="academic_year_id" class="form-select pill-input" required></select>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-navy-pill">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>

<script>
let allClasses = [];
let allDepartments = [];
let allSemesters = [];
let allAcademicYears = [];

document.addEventListener('DOMContentLoaded', () => {
    loadClasses();
});

async function loadClasses() {
    try {
        const data = await AttendEase.apiFetch('/api/admin/classes');
        allClasses = data.classes || [];
        allDepartments = data.departments || [];
        allSemesters = data.semesters || [];
        allAcademicYears = data.acYears || data.academicYears || [];

        populateDropdowns();
        renderClassesTable(allClasses);
    } catch (err) {
        console.error('Failed to load classes:', err);
        AttendEase.showFlash('Failed to load classes list.', 'error');
    }
}

function populateDropdowns() {
    const deptSelect = document.getElementById('addClassDeptSelect');
    deptSelect.innerHTML = '<option value="">Select Dept</option>' +
        allDepartments.map(d => `<option value="${d.id}">${AttendEase.escapeHtml(d.code)} - ${AttendEase.escapeHtml(d.name)}</option>`).join('');

    const semSelect = document.getElementById('addClassSemesterSelect');
    semSelect.innerHTML = allSemesters.map(s => `<option value="${s.id}">${AttendEase.escapeHtml(s.name)}</option>`).join('');

    const yearSelect = document.getElementById('addClassYearSelect');
    yearSelect.innerHTML = allAcademicYears.map(y => `<option value="${y.id}">${AttendEase.escapeHtml(y.year_label)}</option>`).join('');
}

function renderClassesTable(classes) {
    const tbody = document.getElementById('classesTbody');
    document.getElementById('classHeaderCount').textContent = `Active Classes (${classes.length})`;

    if (!classes || classes.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-muted">No classes configured yet.</td></tr>`;
        return;
    }

    tbody.innerHTML = classes.map(c => `
        <tr>
            <td>
                <div class="fw-bold text-dark fs-14">
                    <span class="badge-pill-soft me-2">${AttendEase.escapeHtml(c.name)}</span>
                </div>
            </td>
            <td><span class="fw-semibold text-dark">${AttendEase.escapeHtml(c.dept_code || '')}</span> - ${AttendEase.escapeHtml(c.department_name || '')}</td>
            <td><span class="badge bg-secondary-subtle text-secondary rounded-pill px-3">${AttendEase.escapeHtml(c.semester_name || '')}</span></td>
            <td><code>${AttendEase.escapeHtml(c.year_label || '')}</code></td>
            <td><span class="fw-bold text-dark">${c.student_count || 0}</span> students</td>
            <td class="text-end">
                <button
                    type="button"
                    class="btn btn-sm btn-outline-secondary rounded-pill me-1"
                    onclick="openEditModal(${c.id})"
                    title="Edit Class"
                >
                    <i class="bi bi-pencil-fill"></i>
                </button>
                <form action="/admin/classes/${c.id}/delete" method="POST" style="display:inline;" onsubmit="return confirm('Delete class ${AttendEase.escapeHtml(c.name)}?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill" title="Delete">
                        <i class="bi bi-trash-fill"></i>
                    </button>
                </form>
            </td>
        </tr>
    `).join('');
}

function openEditModal(classId) {
    const c = allClasses.find(item => item.id === classId);
    if (!c) return;

    document.getElementById('editClassForm').action = `/admin/classes/${classId}/edit`;
    document.getElementById('editClassName').value = c.name || '';

    const editDept = document.getElementById('editClassDept');
    editDept.innerHTML = allDepartments.map(d => `
        <option value="${d.id}" ${c.department_id === d.id ? 'selected' : ''}>
            ${AttendEase.escapeHtml(d.code)} - ${AttendEase.escapeHtml(d.name)}
        </option>
    `).join('');

    const editSem = document.getElementById('editClassSemester');
    editSem.innerHTML = allSemesters.map(s => `
        <option value="${s.id}" ${c.semester_id === s.id ? 'selected' : ''}>
            ${AttendEase.escapeHtml(s.name)}
        </option>
    `).join('');

    const editYear = document.getElementById('editClassYear');
    editYear.innerHTML = allAcademicYears.map(y => `
        <option value="${y.id}" ${c.academic_year_id === y.id ? 'selected' : ''}>
            ${AttendEase.escapeHtml(y.year_label)}
        </option>
    `).join('');

    const modal = new bootstrap.Modal(document.getElementById('editClassModal'));
    modal.show();
}
</script>
</body>
</html>
